name: Validate TerraBoost v0.3.0

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct exact v0.3.0 runtime source
        shell: pwsh
        run: |
          $b64 = Get-Content .\terraboost-v030-payload\source.b64 -Raw
          [IO.File]::WriteAllBytes('.\TerraBoost_v030.zip', [Convert]::FromBase64String($b64))
          Expand-Archive '.\TerraBoost_v030.zip' '.\src' -Force
          if (-not (Test-Path '.\src\TerraBoost\Core\HighFpsController.cs')) { throw 'source payload missing' }
          Select-String -Path '.\src\TerraBoost\Core\HighFpsController.cs' -Pattern 'compatibility mode' | Out-Host
          Get-Content '.\src\TerraBoost\build.txt' | Out-Host

      - name: Build against tModLoader 2026.07.3.0
        shell: pwsh
        run: |
          dotnet build .\src\TerraBoost\TerraBoost.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'TerraBoost v0.3.0 build failed' }

      - name: Collect compiled tmod
        shell: pwsh
        run: |
          $tmod = Get-ChildItem -Path .\src -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tmod) { throw 'TerraBoost.tmod not produced' }
          New-Item -ItemType Directory -Path .\artifact -Force | Out-Null
          Copy-Item $tmod.FullName '.\artifact\TerraBoost_v0.3.0.tmod' -Force
          Write-Host "TMOD=$($tmod.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: TerraBoost-v0.3.0
          path: artifact/TerraBoost_v0.3.0.tmod
          if-no-files-found: error
