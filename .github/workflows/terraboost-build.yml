name: Validate TerraBoost v0.3.0 final

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct exact user source ZIP
        shell: pwsh
        run: |
          $parts = Get-ChildItem .\terraboost-v030-payload-final\part_*.txt | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\TerraBoost_v0.3.0_Source.zip', [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash '.\TerraBoost_v0.3.0_Source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source SHA256=$sha"
          if ($sha -ne '4c256a0d0ae99b3bc3ec3eedd72ebb836789a0bbf966a4d2b6ae42d4120ba36b') { throw "source hash mismatch: $sha" }
          Expand-Archive '.\TerraBoost_v0.3.0_Source.zip' '.\src' -Force

      - name: Use standalone CI SDK
        shell: pwsh
        run: |
          @'
          <Project Sdk="Tomat.Terraria.ModLoader.Sdk/2.1.1">
            <PropertyGroup>
              <AssemblyName>TerraBoost</AssemblyName>
              <LangVersion>latest</LangVersion>
              <Nullable>enable</Nullable>
              <TmlVersion>2026.07.3.0</TmlVersion>
            </PropertyGroup>
          </Project>
          '@ | Set-Content '.\src\TerraBoost\TerraBoost.csproj' -Encoding utf8

      - name: Build exact runtime source against tModLoader 2026.07.3.0
        shell: pwsh
        run: |
          dotnet build .\src\TerraBoost\TerraBoost.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'TerraBoost v0.3.0 build failed' }

      - name: Collect compiled tmod
        shell: pwsh
        run: |
          $tmod = Get-ChildItem -Path .\src -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tmod) { throw 'TerraBoost.tmod not produced' }
          New-Item -ItemType Directory -Path .\artifact -Force | Out-Null
          Copy-Item $tmod.FullName '.\artifact\TerraBoost_v0.3.0.tmod' -Force
          Write-Host "TMOD=$($tmod.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: TerraBoost-v0.3.0-final
          path: artifact/TerraBoost_v0.3.0.tmod
          if-no-files-found: error
