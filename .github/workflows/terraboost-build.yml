name: Validate TerraBoost v0.2.3 display hook

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct v0.2.2 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem .\terraboost-v022-payload\part_*.txt | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive '.\source.zip' '.\src' -Force

      - name: Add v0.2.3 API compile probe
        shell: pwsh
        run: |
          @'
          using System;
          using Terraria;
          using Terraria.ModLoader;

          namespace TerraBoost;

          internal static class V023ApiProbe
          {
              internal static void Install()
              {
                  On_Main.SetDisplayMode += Hook;
                  _ = Main.instance?.GraphicsDevice?.PresentationParameters.PresentationInterval.ToString();
              }

              internal static void Remove()
              {
                  On_Main.SetDisplayMode -= Hook;
              }

              private static void Hook(On_Main.orig_SetDisplayMode orig, int width, int height, bool fullscreen)
              {
                  if (Main.graphics is null || Main.instance is null)
                  {
                      orig(width, height, fullscreen);
                      return;
                  }

                  var viewport = Main.instance.GraphicsDevice.Viewport;
                  var pp = Main.instance.GraphicsDevice.PresentationParameters;
                  bool sameMode = Main.graphics.IsFullScreen == fullscreen &&
                                  Main.screenWidth == width && Main.screenHeight == height &&
                                  viewport.Width == width && viewport.Height == height &&
                                  pp.BackBufferWidth == width && pp.BackBufferHeight == height;

                  if (!sameMode)
                      orig(width, height, fullscreen);
              }
          }
          '@ | Set-Content .\src\TerraBoost\V023ApiProbe.cs -Encoding utf8

      - name: Build API probe against tModLoader 2026.07.3.0
        shell: pwsh
        run: |
          dotnet build .\src\TerraBoost\TerraBoost.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'v0.2.3 API probe failed' }
