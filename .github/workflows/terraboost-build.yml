name: Validate TerraBoost v0.2.2

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct exact v0.2.2 source ZIP
        shell: pwsh
        run: |
          $parts = Get-ChildItem .\terraboost-v022-payload\part_*.txt | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 payload parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\TerraBoost_Optimization_v0.2.2_Source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash '.\TerraBoost_Optimization_v0.2.2_Source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne '3d4589269b50a7c4e4b7b8a8045f4fcfe1b700d34e717c9a3a0521d3ac0f61f5') { throw "Source ZIP hash mismatch" }
          Expand-Archive '.\TerraBoost_Optimization_v0.2.2_Source.zip' '.\v022' -Force

      - name: Build exact TerraBoost v0.2.2 source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $project = '.\v022\TerraBoost\TerraBoost.csproj'
          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Build attempt $attempt"
            dotnet build $project -c Release
            if ($LASTEXITCODE -eq 0) { $success = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
          }
          if (-not $success) { throw 'TerraBoost v0.2.2 failed to build after 3 attempts' }

      - name: Locate compiled tMod
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path .\v022 -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue
          if (-not $files) {
            $files = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue
          }
          $file = $files | Select-Object -First 1
          if (-not $file) { throw 'TerraBoost.tmod not found after build' }
          Write-Host "Found: $($file.FullName)"
          New-Item -ItemType Directory -Force -Path .\artifact | Out-Null
          Copy-Item $file.FullName .\artifact\TerraBoost.tmod -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TerraBoost-v0.2.2-tmod
          path: artifact/TerraBoost.tmod
          if-no-files-found: error
