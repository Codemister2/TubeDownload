name: Inspect TerraBoost/tModLoader timing

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build TerraBoost so tModLoader refs are restored
        shell: pwsh
        run: |
          dotnet build .\terraboost-v020\TerraBoost\TerraBoost.csproj -c Release

      - name: Decompile Terraria.Main timing code
        shell: pwsh
        run: |
          dotnet tool install --global ilspycmd --version 9.*
          $dll = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter tModLoader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw 'tModLoader.dll not found' }
          Write-Host "Using $($dll.FullName)"
          ilspycmd -t Terraria.Main $dll.FullName | Out-File -FilePath .\Main_decompiled.cs -Encoding utf8
          $patterns = @('TargetElapsedTime','terrariasFixedTiming','UpdateTimeAccumulator','FrameSkipMode','DoUpdate(','override void Update','ShouldUpdateEntities','GameUpdateCount')
          foreach ($p in $patterns) {
            Write-Host "===== $p ====="
            Select-String -Path .\Main_decompiled.cs -Pattern $p -Context 12,30 | Select-Object -First 6 | ForEach-Object { $_.ToString(); $_.Context.PreContext; $_.Line; $_.Context.PostContext; Write-Host '---' }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Main-decompiled
          path: Main_decompiled.cs
          if-no-files-found: error
