name: Build TerraBoost tMod

on:
  push:
    branches:
      - terraboost-build-20260915
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct TerraBoost source
        shell: pwsh
        run: |
          $parts = Get-ChildItem .\terraboost-ci\tbpart_* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$pwd\TerraBoost_CI.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path .\TerraBoost_CI.zip -DestinationPath .\ci-src -Force

      - name: Build TerraBoost
        shell: pwsh
        run: |
          dotnet build .\ci-src\TerraBoost_CI\TerraBoost.csproj -c Release

      - name: Locate compiled tMod
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue
          if (-not $files) {
            $files = Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter TerraBoost.tmod -ErrorAction SilentlyContinue
          }
          $file = $files | Select-Object -First 1
          if (-not $file) { throw "TerraBoost.tmod not found after build" }
          Write-Host "Found: $($file.FullName)"
          New-Item -ItemType Directory -Force -Path .\artifact | Out-Null
          Copy-Item $file.FullName .\artifact\TerraBoost.tmod -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TerraBoost-tmod
          path: artifact/TerraBoost.tmod
          if-no-files-found: error
