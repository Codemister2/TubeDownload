name: Kuudra Pilot Fabric 26.1.2 Build
on:
  push:
    branches: [kuudrapilot-fabric-2612-build-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kuudra-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build with official Fabric and Minecraft dependencies
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify release metadata
        run: |
          test -f build/libs/kuudrapilot-fabric-26.1.2-0.4.0.jar
          unzip -p build/libs/kuudrapilot-fabric-26.1.2-0.4.0.jar fabric.mod.json
          unzip -l build/libs/kuudrapilot-fabric-26.1.2-0.4.0.jar | grep KuudraPilot
      - uses: actions/upload-artifact@v4
        with:
          name: KuudraPilot-Fabric-26.1.2-0.4.0
          path: kuudra-pilot/build/libs/kuudrapilot-fabric-26.1.2-0.4.0.jar
          if-no-files-found: error
